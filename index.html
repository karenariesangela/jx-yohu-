<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>江西省消费品以旧换新补贴活动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        .slides-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
        .slide.active {
            display: block;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            background: rgba(255, 0, 128, 0.35);
            border: 3px solid #ff0080;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 128, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 128, 0.8); }
        }
        .hotspot:active {
            background: rgba(255, 0, 128, 0.6);
        }
        /* Page indicator */
        .page-indicator {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 10px 18px;
            border-radius: 25px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.3s;
        }
        .dot.active {
            background: #ff4757;
            transform: scale(1.2);
        }
        /* Loading screen */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-text {
            color: white;
            font-size: 16px;
            margin-top: 20px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #ff4757;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Title label on each page */
        .page-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 50;
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <div class="slides-container">
        <!-- Slide 1: 云闪付首页 -->
        <div class="slide active" id="slide1">
            <img src="slide1.jpeg" alt="云闪付首页">
            <div class="page-title">第1页/共4页</div>
            <!-- 玩赚中心按钮 - 放大到占满整个红包区域下方 -->
            <div class="hotspot" style="left: 15%; top: 32%; width: 70%; height: 15%;" onclick="goToSlide(2)">
                ▶ 点击进入活动
            </div>
        </div>
        
        <!-- Slide 2: 活动选择页 -->
        <div class="slide" id="slide2">
            <img src="slide2.jpeg" alt="活动选择页">
            <div class="page-title">第2页/共4页</div>
            <!-- 2026年活动按钮 -->
            <div class="hotspot" style="left: 10%; top: 50%; width: 80%; height: 18%;" onclick="goToSlide(3)">
                ▶ 选择2026年活动
            </div>
        </div>
        
        <!-- Slide 3: 活动详情 -->
        <div class="slide" id="slide3">
            <img src="slide3.jpeg" alt="活动详情">
            <div class="page-title">第3页/共4页</div>
            <!-- 家电以旧换新线上 -->
            <div class="hotspot" style="left: 5%; top: 30%; width: 90%; height: 25%;" onclick="goToSlide(4)">
                ▶ 了解详情
            </div>
        </div>
        
        <!-- Slide 4: 线上家电换新专区 -->
        <div class="slide" id="slide4">
            <img src="slide4.jpeg" alt="线上家电换新专区">
            <div class="page-title">第4页/共4页 - 结束</div>
        </div>
    </div>
    
    <!-- Page indicator -->
    <div class="page-indicator" id="pageIndicator">
        <div class="dot active" data-slide="1"></div>
        <div class="dot" data-slide="2"></div>
        <div class="dot" data-slide="3"></div>
        <div class="dot" data-slide="4"></div>
    </div>

    <script>
        let currentSlide = 1;
        const totalSlides = 4;
        
        function goToSlide(n) {
            if (n < 1 || n > totalSlides) return;
            
            // Hide current slide
            document.getElementById('slide' + currentSlide).classList.remove('active');
            
            // Show new slide
            currentSlide = n;
            document.getElementById('slide' + currentSlide).classList.add('active');
            
            // Update dots
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i + 1 === currentSlide);
            });
            
            // Scroll to top
            window.scrollTo(0, 0);
        }
        
        // Handle tap anywhere on slide (except hotspots) to advance
        document.querySelectorAll('.slide').forEach(slide => {
            slide.addEventListener('click', function(e) {
                // If clicking a hotspot, let the hotspot handle it
                if (e.target.classList.contains('hotspot')) return;
                // Otherwise advance to next slide
                goToSlide(currentSlide + 1);
            });
        });
        
        // Handle swipe
        let touchStartY = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        
        document.addEventListener('touchend', function(e) {
            const touchEndY = e.changedTouches[0].clientY;
            const diffY = touchStartY - touchEndY;
            
            if (e.target.closest('.hotspot')) return;
            
            if (diffY > 50) {
                goToSlide(currentSlide + 1);
            }
        }, { passive: true });
        
        // Hide loading when page is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
            }, 800);
        });
        
        // Fallback
        setTimeout(function() {
            document.getElementById('loading').classList.add('hidden');
        }, 3000);
    </script>
</body>
</html>
